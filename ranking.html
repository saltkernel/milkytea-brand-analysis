<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>排行榜 — 奶茶品牌图鉴</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .page-container { max-width: 1500px; }
        .rank-section { flex: 1; }
        .rank-section h3 {
            font-size: 18px; letter-spacing: 2px; color: var(--gold);
            margin-bottom: 14px; padding-bottom: 8px;
            border-bottom: 1px solid rgba(191,160,122,0.25);
        }
        .rank-list { display: flex; flex-direction: column; gap: 6px; }
        .rank-item {
            display: flex; align-items: center; gap: 14px;
            background: var(--cream-light); border: 1px solid rgba(191,160,122,0.1);
            border-radius: 10px; padding: 12px 16px;
            transition: all 0.2s;
        }
        .rank-item:hover { border-color: var(--gold); background: rgba(191,160,122,0.12); }
        .rank-num {
            flex: 0 0 32px; height: 32px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-weight: bold; font-size: 14px;
        }
        .rank-num.top3 { background: linear-gradient(135deg, var(--gold), var(--bg)); color: var(--cream); }
        .rank-num.normal { background: rgba(191,160,122,0.18); color: var(--text-dim); }
        .rank-info { flex: 1; min-width: 0; }
        .rank-info .name { font-weight: bold; color: var(--cream); font-size: 14px; }
        .rank-info .brand {
            font-size: 11px; color: var(--text-dim); display: flex; align-items: center;
            gap: 8px; margin-top: 2px;
        }
        .rank-info .brand .dot {
            width: 8px; height: 8px; border-radius: 50%; display: inline-block;
        }
        .rank-value { text-align: right; flex-shrink: 0; }
        .rank-value .main { font-size: 18px; font-weight: bold; color: var(--cream); }
        .rank-value .sub { font-size: 10px; color: var(--text-dim); display: block; }
        .rank-value .sub.unit { font-size: 14px; color: var(--text-dim); }

        .rank-grid { display: flex; gap: 32px; }
        .rank-col { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 36px; }
        @media (max-width: 768px) { .rank-grid { flex-direction: column; } }
    </style>
</head>
<body>

<div class="page-wrapper">
    <div class="page-container">
        <div class="breadcrumb"><a href="index.html?skip=1">首页</a><span class="sep">›</span><span>排行榜</span></div>
        <div class="page-hero">
            <h1>六大维度排行榜</h1>
            <p>价格 · 热量 · 容量 · 性价比 — 全品牌 Top 10</p>
        </div>

        <div class="rank-grid" id="rankGrid">
            <!-- JS 动态生成 -->
        </div>
    </div>
</div>

<script type="text/javascript" src="js/data.js"></script>
<script>var CURRENT_PAGE = 'ranking';</script>
<script type="text/javascript" src="js/nav.js"></script>
<script>
    MT.ready(function(data) {
        var valid = MT.filterValid();
        var rankings = [
            { id: 'price_high', title: '💰 最贵产品 Top 10', sort: function(a,b){return b['单位价格 元/100ml']-a['单位价格 元/100ml'];}, mainField: '单位价格 元/100ml', mainUnit: '元/100ml', mainFn: function(d){return d['单位价格 元/100ml'].toFixed(2);}, subFn: function(d){return '总价 ¥'+d['总价/元']+' · '+d['容量/ml']+'ml';} },
            { id: 'price_low', title: '💵 最便宜产品 Top 10', sort: function(a,b){return a['单位价格 元/100ml']-b['单位价格 元/100ml'];}, mainField: '单位价格 元/100ml', mainUnit: '元/100ml', mainFn: function(d){return d['单位价格 元/100ml'].toFixed(2);}, subFn: function(d){return '总价 ¥'+d['总价/元']+' · '+d['容量/ml']+'ml';} },
            { id: 'heat_high', title: '🔥 热量炸弹 Top 10', sort: function(a,b){return b['单位热量 kcal/100ml']-a['单位热量 kcal/100ml'];}, mainField: '单位热量 kcal/100ml', mainUnit: 'kcal/100ml', mainFn: function(d){return d['单位热量 kcal/100ml'].toFixed(1);}, subFn: function(d){return '总热量 '+d['总热量/kcal']+' kcal';}, accent: true },
            { id: 'heat_low', title: '💚 最低热量 Top 10', sort: function(a,b){return a['单位热量 kcal/100ml']-b['单位热量 kcal/100ml'];}, mainField: '单位热量 kcal/100ml', mainUnit: 'kcal/100ml', mainFn: function(d){return d['单位热量 kcal/100ml'].toFixed(1);}, subFn: function(d){return '总热量 '+d['总热量/kcal']+' kcal';}, green: true },
            { id: 'size_big', title: '🥤 最大容量 Top 10', sort: function(a,b){return b['容量/ml']-a['容量/ml'];}, mainField: '容量/ml', mainUnit: 'ml', mainFn: function(d){return d['容量/ml']+'ml';}, subFn: function(d){return '¥'+d['总价/元']+' · '+d['单位热量 kcal/100ml'].toFixed(1)+' kcal/100ml';} },
            { id: 'cp_best', title: '⚡ 最佳性价比 Top 10', sort: function(a,b){return MT.costPerformance(b)-MT.costPerformance(a);}, mainField: '性价比', mainUnit: 'ml/¥', mainFn: function(d){return MT.costPerformance(d)+' ml/¥';}, subFn: function(d){return '¥'+d['总价/元']+' · '+d['容量/ml']+'ml';} }
        ];

        var html = '';
        // 左列：0(最贵), 2(热量炸弹), 4(最大容量)；右列：1(最便宜), 3(最低热量), 5(最佳性价比)
        var colOrder = [0, 2, 4, 1, 3, 5]; // 交错排列，左右配对标高/标低
        var leftHTML = '', rightHTML = '';
        colOrder.forEach(function(ri, i) {
            var rank = rankings[ri];
            var sorted = valid.slice().sort(rank.sort).slice(0, 10);
            var secHTML = '<div class="rank-section"><h3>'+rank.title+'</h3><div class="rank-list">';
            sorted.forEach(function(d, idx) {
                var bColor = MT.colorForBrand(d['品牌']);
                var numClass = idx < 3 ? 'top3' : 'normal';
                var valColor = rank.accent ? 'color:#C97B7B;' : rank.green ? 'color:#A8BFA8;' : '';
                secHTML +=
                    '<div class="rank-item">' +
                        '<div class="rank-num '+numClass+'">'+(idx+1)+'</div>' +
                        '<div class="rank-info">' +
                            '<div class="name">'+d['饮品名称']+'</div>' +
                            '<div class="brand"><span class="dot" style="background:'+bColor+';"></span>'+d['品牌']+
                                ' · '+d['基底液']+' · '+d['茶底类型']+
                                (d['是否含默认小料']==='是'?' · <span class="badge badge-red">含小料</span>':'')+
                            '</div>' +
                        '</div>' +
                        '<div class="rank-value"><span class="main" style="'+valColor+'">'+rank.mainFn(d)+'</span><span class="sub">'+rank.subFn(d)+'</span></div>' +
                    '</div>';
            });
            secHTML += '</div></div>';
            if (i < 3) leftHTML += secHTML;
            else rightHTML += secHTML;
        });
        html = '<div class="rank-col">'+leftHTML+'</div><div class="rank-col">'+rightHTML+'</div>';
        document.getElementById('rankGrid').innerHTML = html;
    });
</script>

</body>
</html>
