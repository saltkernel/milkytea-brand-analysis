<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>产品探索 — 奶茶品牌图鉴</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .page-container { max-width: 1500px; }
        .explorer-layout { display: flex; gap: 24px; align-items: flex-start; }
        .filter-sidebar {
            flex: 0 0 260px; position: sticky; top: calc(var(--nav-h) + 20px);
            background: var(--cream-light); border: 1px solid rgba(191,160,122,0.2);
            border-radius: var(--card-radius); padding: 20px; max-height: calc(100vh - var(--nav-h) - 40px);
            overflow-y: auto;
        }
        .filter-sidebar h3 {
            font-size: 14px; letter-spacing: 2px; margin-bottom: 16px;
            color: var(--gold);
        }
        .filter-group { margin-bottom: 18px; }
        .filter-group label {
            display: block; font-size: 11px; color: var(--text-dim);
            letter-spacing: 1px; margin-bottom: 6px; text-transform: uppercase;
        }
        .filter-group select, .filter-group input[type="range"] {
            width: 100%; background: rgba(61,46,31,0.5); border: 1px solid rgba(191,160,122,0.3);
            color: var(--cream); border-radius: 8px; padding: 8px 10px; font-size: 12px;
            outline: none; font-family: inherit;
        }
        .filter-group select { cursor: pointer; }
        .filter-group select option { background: var(--bg-dark); color: var(--cream); }
        .range-labels { display: flex; justify-content: space-between; font-size: 10px; color: var(--text-faint); margin-top: 4px; }
        .filter-group .checkbox-grid { display: flex; flex-wrap: wrap; gap: 6px; }
        .filter-group .chip {
            padding: 4px 10px; border-radius: 14px; font-size: 11px;
            border: 1px solid rgba(191,160,122,0.35); color: var(--text-dim);
            cursor: pointer; transition: all 0.2s; user-select: none;
        }
        .filter-group .chip:hover { border-color: var(--gold); color: var(--cream); }
        .filter-group .chip.active { background: rgba(191,160,122,0.25); border-color: var(--gold); color: var(--cream); font-weight: bold; }

        .results-area { flex: 1; min-width: 0; }
        .results-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 16px; flex-wrap: wrap; gap: 10px;
        }
        .results-count { font-size: 14px; color: var(--text-dim); }
        .results-count strong { color: var(--cream); }
        .sort-select { background: rgba(61,46,31,0.5); border: 1px solid rgba(191,160,122,0.3); color: var(--cream); border-radius: 8px; padding: 6px 12px; font-size: 12px; font-family: inherit; cursor: pointer; }

        .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
        .product-card {
            background: var(--cream-light); border: 1px solid rgba(191,160,122,0.15);
            border-radius: 12px; padding: 18px; transition: all 0.25s;
            position: relative; overflow: hidden;
        }
        .product-card:hover { border-color: var(--gold); transform: translateY(-2px); box-shadow: var(--shadow-hover); }
        .product-card .pc-brand {
            font-size: 11px; letter-spacing: 2px; padding: 2px 8px; border-radius: 10px;
            display: inline-block; margin-bottom: 8px; font-weight: bold;
        }
        .product-card .pc-name { font-size: 16px; font-weight: bold; color: var(--cream); margin-bottom: 10px; line-height: 1.4; }
        .product-card .pc-stats { display: flex; flex-wrap: wrap; gap: 8px; }
        .product-card .pc-stat {
            flex: 1 1 40%; min-width: 80px; background: rgba(0,0,0,0.2);
            border-radius: 8px; padding: 8px 10px; text-align: center;
        }
        .product-card .pc-stat .val { font-size: 18px; font-weight: bold; color: var(--cream); }
        .product-card .pc-stat .lbl { font-size: 10px; color: var(--text-dim); letter-spacing: 1px; margin-top: 2px; }

        .reco-section { margin-bottom: 28px; }
        .reco-section h3 { font-size: 15px; letter-spacing: 2px; color: var(--gold); margin-bottom: 14px; }
        .reco-cards { display: flex; gap: 14px; flex-wrap: wrap; }
        .reco-card {
            flex: 1 1 200px; background: linear-gradient(135deg, rgba(191,160,122,0.18), rgba(61,46,31,0.5));
            border: 1px solid var(--gold); border-radius: 12px; padding: 18px;
            text-align: center; min-width: 180px;
        }
        .reco-card .reco-badge {
            display: inline-block; padding: 2px 12px; border-radius: 12px;
            font-size: 10px; letter-spacing: 2px; font-weight: bold; margin-bottom: 10px;
        }
        .reco-card .reco-badge.green { background: rgba(168,191,168,0.2); color: var(--green); }
        .reco-card .reco-badge.red { background: rgba(201,123,123,0.2); color: var(--accent); }
        .reco-card .reco-badge.gold { background: rgba(191,160,122,0.2); color: var(--gold-light); }
        .reco-card .reco-name { font-size: 15px; font-weight: bold; color: var(--cream); margin: 6px 0; }
        .reco-card .reco-meta { font-size: 11px; color: var(--text-dim); }

        @media (max-width: 768px) {
            .explorer-layout { flex-direction: column; }
            .filter-sidebar { flex: none; width: 100%; position: static; max-height: none; padding: 16px; }
        }
        @media (max-width: 480px) {
            .product-grid { gap: 10px; }
            .product-card { padding: 14px; }
            .reco-cards { gap: 10px; }
            .reco-card { padding: 14px; min-width: 100%; }
        }
    </style>
</head>
<body>

<div class="page-wrapper">
    <div class="page-container">
        <div class="breadcrumb"><a href="index.html?skip=1">首页</a><span class="sep">›</span><span>产品探索</span></div>
        <div class="page-hero">
            <h1>产品探索器</h1>
            <p>筛选 · 排序 · 智能推荐 — 找到最适合你的那杯茶</p>
        </div>

        <!-- 智能推荐区 -->
        <div class="reco-section" id="recoSection">
            <h3>✨ 智能推荐</h3>
            <div class="reco-cards" id="recoCards"></div>
        </div>

        <!-- 探索布局 -->
        <div class="explorer-layout">
            <!-- 左侧筛选 -->
            <aside class="filter-sidebar">
                <h3>🎛️ 筛选条件</h3>
                <div class="filter-group">
                    <label>品牌</label>
                    <div class="checkbox-grid" id="brandChips"></div>
                </div>
                <div class="filter-group">
                    <label>茶底类型</label>
                    <div class="checkbox-grid" id="teaChips"></div>
                </div>
                <div class="filter-group">
                    <label>基底液</label>
                    <div class="checkbox-grid" id="baseChips"></div>
                </div>
                <div class="filter-group">
                    <label>单位价格：<span id="priceLabel">0 - 6</span> 元/100ml</label>
                    <input type="range" id="priceRange" min="0" max="6" value="6" step="0.1">
                    <div class="range-labels"><span>¥0</span><span>¥6</span></div>
                </div>
                <div class="filter-group">
                    <label>单位热量：<span id="heatLabel">0 - 100</span> kcal/100ml</label>
                    <input type="range" id="heatRange" min="0" max="100" value="100" step="1">
                    <div class="range-labels"><span>0</span><span>100</span></div>
                </div>
                <div class="filter-group">
                    <label>容量</label>
                    <select id="sizeSelect">
                        <option value="all">全部容量</option>
                        <option value="small">小杯（＜400ml）</option>
                        <option value="mid">中杯（400~600ml）</option>
                        <option value="large">大杯（＞600ml）</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label>是否含小料</label>
                    <select id="toppingSelect">
                        <option value="all">不限</option>
                        <option value="yes">含小料</option>
                        <option value="no">不含小料</option>
                    </select>
                </div>
                <button class="btn btn-outline" onclick="resetFilters()" style="width:100%;justify-content:center;">重置筛选</button>
            </aside>

            <!-- 右侧结果 -->
            <div class="results-area">
                <div class="results-header">
                    <span class="results-count">找到 <strong id="matchCount">0</strong> 款产品</span>
                    <select class="sort-select" id="sortSelect">
                        <option value="default">默认排序</option>
                        <option value="price_asc">价格 ↑ 从低到高</option>
                        <option value="price_desc">价格 ↓ 从高到低</option>
                        <option value="heat_asc">热量 ↑ 从低到高</option>
                        <option value="heat_desc">热量 ↓ 从高到低</option>
                        <option value="cp_desc">性价比 ↑ 从高到低</option>
                        <option value="size_desc">容量 ↑ 从大到小</option>
                    </select>
                </div>
                <div class="product-grid" id="productGrid"></div>
            </div>
        </div>
    </div>
</div>

<script type="text/javascript" src="js/data.js"></script>
<script>var CURRENT_PAGE = 'explorer';</script>
<script type="text/javascript" src="js/nav.js"></script>
<script>
    var allProducts = [];
    var filterState = { brands: [], teas: [], bases: [], maxPrice: 6, maxHeat: 100, size: 'all', topping: 'all', sort: 'default' };

    MT.ready(function(data) {
        allProducts = data;

        // 初始化所有筛选选项

        // 品牌
        var brands = MT.getBrands();
        var brandHTML = '';
        brands.forEach(function(b) {
            brandHTML += '<span class="chip brand-chip" data-val="'+b+'">'+b+'</span>';
        });
        document.getElementById('brandChips').innerHTML = brandHTML;

        // 茶底
        var teaSet = {}; data.forEach(function(d){teaSet[(d['茶底类型']||'无茶底').trim()]=true;});
        var teaHTML = '';
        Object.keys(teaSet).sort().forEach(function(t){ teaHTML += '<span class="chip tea-chip" data-val="'+t+'">'+t+'</span>'; });
        document.getElementById('teaChips').innerHTML = teaHTML;

        // 基底液
        var baseSet = {}; data.forEach(function(d){baseSet[(d['基底液']||'无基底').trim()]=true;});
        var baseHTML = '';
        Object.keys(baseSet).sort().forEach(function(b){ baseHTML += '<span class="chip base-chip" data-val="'+b+'">'+b+'</span>'; });
        document.getElementById('baseChips').innerHTML = baseHTML;

        // Chip 点击事件
        document.querySelectorAll('.chip').forEach(function(c) {
            c.addEventListener('click', function() {
                this.classList.toggle('active');
                updateFilters();
            });
        });

        // Range 事件
        document.getElementById('priceRange').addEventListener('input', function() {
            filterState.maxPrice = parseFloat(this.value);
            document.getElementById('priceLabel').textContent = '0 - ' + this.value;
            renderProducts();
        });
        document.getElementById('heatRange').addEventListener('input', function() {
            filterState.maxHeat = parseInt(this.value);
            document.getElementById('heatLabel').textContent = '0 - ' + this.value;
            renderProducts();
        });

        // Select 事件
        document.getElementById('sizeSelect').addEventListener('change', function() { filterState.size = this.value; renderProducts(); });
        document.getElementById('toppingSelect').addEventListener('change', function() { filterState.topping = this.value; renderProducts(); });
        document.getElementById('sortSelect').addEventListener('change', function() { filterState.sort = this.value; renderProducts(); });

        renderProducts();
    });

    function updateFilters() {
        filterState.brands = []; document.querySelectorAll('.brand-chip.active').forEach(function(c){filterState.brands.push(c.dataset.val);});
        filterState.teas = []; document.querySelectorAll('.tea-chip.active').forEach(function(c){filterState.teas.push(c.dataset.val);});
        filterState.bases = []; document.querySelectorAll('.base-chip.active').forEach(function(c){filterState.bases.push(c.dataset.val);});
        renderProducts();
    }

    window.resetFilters = function() {
        document.querySelectorAll('.chip.active').forEach(function(c){c.classList.remove('active');});
        document.getElementById('priceRange').value = 6; document.getElementById('priceLabel').textContent = '0 - 6';
        document.getElementById('heatRange').value = 100; document.getElementById('heatLabel').textContent = '0 - 100';
        document.getElementById('sizeSelect').value = 'all';
        document.getElementById('toppingSelect').value = 'all';
        document.getElementById('sortSelect').value = 'default';
        updateFilters();
        filterState.maxPrice = 6; filterState.maxHeat = 100; filterState.size = 'all'; filterState.topping = 'all'; filterState.sort = 'default';
        renderProducts();
    };

    function renderProducts() {
        var filtered = allProducts.filter(function(d) {
            if (filterState.brands.length > 0 && filterState.brands.indexOf(d['品牌']) === -1) return false;
            if (filterState.teas.length > 0 && filterState.teas.indexOf((d['茶底类型']||'无茶底').trim()) === -1) return false;
            if (filterState.bases.length > 0 && filterState.bases.indexOf((d['基底液']||'无基底').trim()) === -1) return false;
            if (d['单位价格 元/100ml'] === '#DIV/0!' || typeof d['单位价格 元/100ml'] !== 'number') return false;
            if (d['单位热量 kcal/100ml'] === '#DIV/0!' || typeof d['单位热量 kcal/100ml'] !== 'number' || d['单位热量 kcal/100ml'] <= 0) return false;
            if (d['单位价格 元/100ml'] > filterState.maxPrice) return false;
            if (d['单位热量 kcal/100ml'] > filterState.maxHeat) return false;
            if (filterState.size === 'small' && d['容量/ml'] >= 400) return false;
            if (filterState.size === 'mid' && (d['容量/ml'] < 400 || d['容量/ml'] > 600)) return false;
            if (filterState.size === 'large' && d['容量/ml'] <= 600) return false;
            if (filterState.topping === 'yes' && d['是否含默认小料'] !== '是') return false;
            if (filterState.topping === 'no' && d['是否含默认小料'] !== '否') return false;
            return true;
        });

        // 排序
        if (filterState.sort === 'price_asc') filtered.sort(function(a,b){return a['单位价格 元/100ml']-b['单位价格 元/100ml'];});
        else if (filterState.sort === 'price_desc') filtered.sort(function(a,b){return b['单位价格 元/100ml']-a['单位价格 元/100ml'];});
        else if (filterState.sort === 'heat_asc') filtered.sort(function(a,b){return a['单位热量 kcal/100ml']-b['单位热量 kcal/100ml'];});
        else if (filterState.sort === 'heat_desc') filtered.sort(function(a,b){return b['单位热量 kcal/100ml']-a['单位热量 kcal/100ml'];});
        else if (filterState.sort === 'cp_desc') filtered.sort(function(a,b){return MT.costPerformance(b)-MT.costPerformance(a);});
        else if (filterState.sort === 'size_desc') filtered.sort(function(a,b){return b['容量/ml']-a['容量/ml'];});

        document.getElementById('matchCount').textContent = filtered.length;

        var html = '';
        filtered.forEach(function(d) {
            var bColor = MT.colorForBrand(d['品牌']);
            var cp = MT.costPerformance(d);
            var hasTop = d['是否含默认小料'] === '是' ? ' <span class="badge badge-red">含小料</span>' : '';
            html += '<div class="product-card">' +
                '<span class="pc-brand" style="background:rgba('+hexToRgb(bColor).r+','+hexToRgb(bColor).g+','+hexToRgb(bColor).b+',0.2);color:'+bColor+';">'+d['品牌']+'</span>' +
                '<div class="pc-name">'+d['饮品名称']+hasTop+'</div>' +
                '<div class="pc-stats">' +
                    '<div class="pc-stat"><div class="lbl">价格</div><div class="val">¥'+d['总价/元']+'</div><div class="lbl">'+d['单位价格 元/100ml']+'/100ml</div></div>' +
                    '<div class="pc-stat"><div class="lbl">热量</div><div class="val">'+d['总热量/kcal']+'kcal</div><div class="lbl">'+d['单位热量 kcal/100ml']+'/100ml</div></div>' +
                    '<div class="pc-stat"><div class="lbl">容量</div><div class="val">'+d['容量/ml']+'ml</div><div class="lbl">性价比 '+cp+' ml/¥</div></div>' +
                    '<div class="pc-stat"><div class="lbl">配方</div><div class="val" style="font-size:13px;">'+d['基底液']+'</div><div class="lbl">'+d['茶底类型']+' · '+d['顶料']+'</div></div>' +
                '</div>' +
            '</div>';
        });
        document.getElementById('productGrid').innerHTML = html || '<div style="text-align:center;padding:60px;color:var(--text-dim);">😕 没有匹配的产品，试试放宽筛选条件</div>';

        // 智能推荐
        updateRecos(filtered);
    }

    function updateRecos(filtered) {
        var recoHTML = '';
        if (filtered.length > 0) {
            // 最低价
            var cheapest = filtered.slice().sort(function(a,b){return a['单位价格 元/100ml']-b['单位价格 元/100ml'];})[0];
            recoHTML += '<div class="reco-card"><span class="reco-badge green">🏷️ 最低价</span><div class="reco-name">'+cheapest['饮品名称']+'</div><div class="reco-meta">'+cheapest['品牌']+' · ¥'+cheapest['单位价格 元/100ml']+'/100ml</div></div>';

            // 最低卡
            var lowest = filtered.slice().sort(function(a,b){return a['单位热量 kcal/100ml']-b['单位热量 kcal/100ml'];})[0];
            recoHTML += '<div class="reco-card"><span class="reco-badge green">💚 最低卡</span><div class="reco-name">'+lowest['饮品名称']+'</div><div class="reco-meta">'+lowest['品牌']+' · '+lowest['单位热量 kcal/100ml']+' kcal/100ml</div></div>';

            // 最高性价比
            var best = filtered.slice().sort(function(a,b){return MT.costPerformance(b)-MT.costPerformance(a);})[0];
            recoHTML += '<div class="reco-card"><span class="reco-badge gold">⚡ 最高性价比</span><div class="reco-name">'+best['饮品名称']+'</div><div class="reco-meta">'+best['品牌']+' · '+MT.costPerformance(best)+' ml/¥</div></div>';
        }
        document.getElementById('recoCards').innerHTML = recoHTML || '<span style="color:var(--text-dim);">请选择筛选条件查看推荐</span>';
    }

    function hexToRgb(hex) {
        var r = parseInt(hex.substring(1,3),16), g = parseInt(hex.substring(3,5),16), b = parseInt(hex.substring(5,7),16);
        return {r:r, g:g, b:b};
    }
</script>

</body>
</html>
